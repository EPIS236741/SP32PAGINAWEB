<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relé — mi_rele_001</title>

  <!-- MQTT.js via CDN (cliente MQTT para navegadores) -->
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0b0c;
      --card: #17171a;
      --surface: #1f1f23;
      --border: #2c2c30;
      --text: #f3f3f1;
      --text-muted: #8b8b90;
      --red: #e0342d;
      --red-dim: #3a1616;
      --red-glow: rgba(224,52,45,0.35);
      --green: #2ea043;
      --green-glow: rgba(46,160,67,0.35);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Manrope', system-ui, sans-serif;
      background:
        radial-gradient(circle at 30% 0%, #1a1a1d 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      max-width: 390px;
      width: 100%;
      padding: 32px 30px;
      box-shadow: 0 30px 60px -25px rgba(0,0,0,0.8);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 26px;
    }

    h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }

    .device-id {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
    }

    /* ── Estado ── */
    .status-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 20px;
    }

    .status-ring {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid var(--text-muted);
      background: transparent;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .status-ring.on {
      border-color: var(--red);
      background: var(--red);
      box-shadow: 0 0 0 5px var(--red-glow);
    }

    .status-text {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .status-text.on  { color: var(--text); }
    .status-text.off { color: var(--text-muted); }

    /* ── Bloque de datos ── */
    .data-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .row-label { font-size: 0.82rem; color: var(--text-muted); font-weight: 500; }

    .row-value {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .ldr-bar-wrap {
      width: 100%;
      height: 5px;
      background: var(--border);
      border-radius: 3px;
      position: relative;
      margin-bottom: 4px;
    }

    .ldr-bar {
      height: 100%;
      background: var(--red);
      border-radius: 3px;
      transition: width 0.5s ease;
    }

    .umbral-line {
      position: absolute;
      top: -5px;
      width: 2px;
      height: 15px;
      background: var(--text);
      border-radius: 1px;
      transition: left 0.3s;
    }

    .mode-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .mode-badge.manual { color: var(--red); border-color: rgba(224,52,45,0.4); }

    /* ── Selector de modo ── */
    .mode-selector {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 18px;
    }

    .mode-btn {
      flex: 1;
      padding: 11px 0;
      text-align: center;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.82rem;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: var(--red);
      color: #fff;
    }

    .mode-btn:hover:not(.active) { color: var(--text); }

    /* ── Controles manuales ── */
    .manual-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      transition: opacity 0.3s;
    }

    .manual-controls.disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    .ctrl-btn {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s, box-shadow 0.15s, transform 0.15s;
    }

    .btn-on {
      background: transparent;
      border: 1px solid var(--green);
      color: var(--green);
    }
    .btn-on:hover { background: rgba(46,160,67,0.1); }
    .btn-on:active,
    .btn-on.pressed {
      background: var(--green);
      color: #fff;
      box-shadow: 0 0 0 6px var(--green-glow);
      animation: pressPulse 0.35s ease;
    }

    .btn-off {
      background: transparent;
      border: 1px solid var(--red);
      color: var(--red);
    }
    .btn-off:hover { background: rgba(224,52,45,0.1); }
    .btn-off:active,
    .btn-off.pressed {
      background: var(--red);
      color: #fff;
      box-shadow: 0 0 0 6px var(--red-glow);
      animation: pressPulse 0.35s ease;
    }

    @keyframes pressPulse {
      0%   { transform: scale(0.95); }
      55%  { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    /* ── Umbral ── */
    .threshold-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .threshold-title { font-size: 0.82rem; color: var(--text-muted); font-weight: 500; }
    .threshold-val { font-size: 0.9rem; font-weight: 700; color: var(--red); }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      margin-bottom: 4px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      background: var(--red);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 0 4px var(--red-glow);
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px; height: 16px;
      background: var(--red);
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }

    .hint {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 12px;
      line-height: 1.6;
    }

    /* ── Conexión ── */
    .conn-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 22px;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
    }
    .dot.ok   { background: #4caf6e; }
    .dot.err  { background: var(--red); }
    .dot.wait { background: var(--text-muted); animation: blink 1s infinite; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <h1>Control de Luz</h1>
    </div>

    <div class="status-wrap">
      <span class="status-ring" id="releCircle"></span>
      <span class="status-text off" id="releText">Apagado</span>
    </div>

    <div class="data-card">
      <div class="row">
        <span class="row-label">Sensor de luz (LDR)</span>
        <span class="mode-badge" id="modoBadge">Automático</span>
      </div>
      <div class="row-value" id="ldrValue">—</div>
      <div class="ldr-bar-wrap" style="margin-top:10px;">
        <div class="ldr-bar" id="ldrBar" style="width:0%"></div>
        <div class="umbral-line" id="umbralLine" style="left:36.6%"></div>
      </div>
    </div>

    <div class="mode-selector">
      <button class="mode-btn active" id="btnAuto" onclick="enviarModo('auto')">Automático</button>
      <button class="mode-btn" id="btnManual" onclick="enviarModo('manual')">Manual</button>
    </div>

    <div class="manual-controls disabled" id="manualControls">
      <button class="ctrl-btn btn-on"  onclick="enviarRele(true, this)">Encender</button>
      <button class="ctrl-btn btn-off" onclick="enviarRele(false, this)">Apagar</button>
    </div>

    <div class="threshold-header">
      <span class="threshold-title">Umbral de luz</span>
      <span class="threshold-val" id="umbralDisplay">1500</span>
    </div>
    <input type="range" id="umbralSlider" min="0" max="4095" value="1500"
           oninput="umbralUI(this.value)"
           onchange="enviarUmbral(this.value)">
    <p class="hint">Menos luz que el umbral → relé se enciende. Más luz → se apaga.</p>

    <div class="conn-bar">
      <div class="dot wait" id="dot"></div>
      <span id="connLabel">Conectando al broker MQTT…</span>
    </div>
  </div>

  <script>
    // =========================================================
    // >>> CONFIGURACIÓN <<<
    // Este DEVICE_ID debe ser IDÉNTICO al del código del ESP32
    // =========================================================
    const DEVICE_ID = 'mi_rele_001';
    // =========================================================

    const TOPIC_ESTADO = `esp32/${DEVICE_ID}/estado`;
    const TOPIC_CMD    = `esp32/${DEVICE_ID}/cmd`;
    const BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';

    const clientId = 'WEB_' + DEVICE_ID + '_' + Math.random().toString(16).slice(2, 8);

    const client = mqtt.connect(BROKER_URL, {
      clientId: clientId,
      clean: true,
      connectTimeout: 5000,
      reconnectPeriod: 3000,
    });

    let estado = { ldr: 0, rele: false, auto: true, umbral: 1500 };

    client.on('connect', () => {
      setConn('ok', 'Conectado al broker MQTT');
      client.subscribe(TOPIC_ESTADO, { qos: 0 });
    });

    client.on('reconnect', () => setConn('wait', 'Reconectando…'));
    client.on('offline',   () => setConn('err',  'Sin conexión'));
    client.on('error',     () => setConn('err',  'Error de conexión'));

    client.on('message', (topic, payload) => {
      if (topic === TOPIC_ESTADO) {
        try {
          estado = JSON.parse(payload.toString());
          actualizarUI();
        } catch (e) {
          console.error('JSON inválido:', e);
        }
      }
    });

    function actualizarUI() {
      const ring = document.getElementById('releCircle');
      const txt  = document.getElementById('releText');
      if (estado.rele) {
        ring.className = 'status-ring on';
        txt.className = 'status-text on';
        txt.textContent = 'Encendido';
      } else {
        ring.className = 'status-ring';
        txt.className = 'status-text off';
        txt.textContent = 'Apagado';
      }

      document.getElementById('ldrValue').textContent = estado.ldr;
      document.getElementById('ldrBar').style.width = (estado.ldr / 4095 * 100) + '%';

      const badge = document.getElementById('modoBadge');
      if (estado.auto) {
        badge.textContent = 'Automático';
        badge.className = 'mode-badge';
        document.getElementById('btnAuto').classList.add('active');
        document.getElementById('btnManual').classList.remove('active');
        document.getElementById('manualControls').classList.add('disabled');
      } else {
        badge.textContent = 'Manual';
        badge.className = 'mode-badge manual';
        document.getElementById('btnAuto').classList.remove('active');
        document.getElementById('btnManual').classList.add('active');
        document.getElementById('manualControls').classList.remove('disabled');
      }

      document.getElementById('umbralSlider').value = estado.umbral;
      document.getElementById('umbralDisplay').textContent = estado.umbral;
      document.getElementById('umbralLine').style.left = (estado.umbral / 4095 * 100) + '%';
    }

    function enviarCmd(obj) {
      client.publish(TOPIC_CMD, JSON.stringify(obj), { qos: 0 });
    }

    function enviarModo(modo) { enviarCmd({ modo }); }
    function enviarRele(on, btn) {
      enviarCmd({ rele: on });
      if (btn) {
        btn.classList.add('pressed');
        setTimeout(() => btn.classList.remove('pressed'), 350);
      }
    }

    let umbralTimer = null;
    function enviarUmbral(val) {
      clearTimeout(umbralTimer);
      umbralTimer = setTimeout(() => enviarCmd({ umbral: parseInt(val) }), 250);
    }

    function umbralUI(val) {
      document.getElementById('umbralDisplay').textContent = val;
      document.getElementById('umbralLine').style.left = (val / 4095 * 100) + '%';
    }

    function setConn(type, text) {
      document.getElementById('dot').className = 'dot ' + type;
      document.getElementById('connLabel').textContent = text;
    }
  </script>
</body>
</html>
